name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Add Capacitor Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Enable Cleartext HTTP Traffic to Local Router IP (192.168.1.1)
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Router-Control-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
