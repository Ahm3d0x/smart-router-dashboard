name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Add Capacitor Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Configure Android Network Security & Self-Signed SSL Bypass for Local Gateways
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          # Enable cleartext traffic and link network security config in AndroidManifest.xml
          if ! grep -q "networkSecurityConfig" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config"/g' android/app/src/main/AndroidManifest.xml
          fi

          # Patch MainActivity.java to bypass self-signed SSL certificate validation for router gateways (192.168.1.1)
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.smartrouter.dashboard;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import java.security.SecureRandom;
          import java.security.cert.X509Certificate;
          import javax.net.ssl.HostnameVerifier;
          import javax.net.ssl.HttpsURLConnection;
          import javax.net.ssl.SSLContext;
          import javax.net.ssl.SSLSession;
          import javax.net.ssl.TrustManager;
          import javax.net.ssl.X509TrustManager;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  trustAllRouterCertificates();
                  super.onCreate(savedInstanceState);
              }

              private void trustAllRouterCertificates() {
                  try {
                      TrustManager[] trustAllCerts = new TrustManager[]{
                          new X509TrustManager() {
                              public X509Certificate[] getAcceptedIssuers() { return new X509Certificate[0]; }
                              public void checkClientTrusted(X509Certificate[] certs, String authType) {}
                              public void checkServerTrusted(X509Certificate[] certs, String authType) {}
                          }
                      };
                      SSLContext sc = SSLContext.getInstance("TLS");
                      sc.init(null, trustAllCerts, new SecureRandom());
                      HttpsURLConnection.setDefaultSSLSocketFactory(sc.getSocketFactory());
                      HttpsURLConnection.setDefaultHostnameVerifier(new HostnameVerifier() {
                          @Override
                          public boolean verify(String hostname, SSLSession session) {
                              return true;
                          }
                      });
                  } catch (Exception ignored) {}
              }
          }
          EOF
          fi

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Router-Control-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
